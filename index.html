<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>빠른 두더지 게임</title>
<style>
:root {
  --bg1: #0f172a;
  --bg2: #172554;
  --card: #f8fafc;
  --ink: #0f172a;
  --accent: #f97316;
  --accent-2: #06b6d4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
  font-family: "Noto Sans KR", sans-serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.25), transparent 40%),
    radial-gradient(circle at 80% 10%, rgba(249, 115, 22, 0.2), transparent 35%),
    linear-gradient(160deg, var(--bg1), var(--bg2));
}
.wrap {
  width: min(860px, 100%);
  background: var(--card);
  color: var(--ink);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 20px 45px rgba(2, 8, 23, 0.45);
}
h1 {
  margin: 0;
  font-size: 30px;
}
.sub {
  margin: 8px 0 16px;
  color: #475569;
}
.top {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.stats {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.badge {
  background: #e2e8f0;
  border-radius: 999px;
  padding: 7px 12px;
  font-weight: 700;
}
.controls {
  display: flex;
  gap: 8px;
}
button {
  border: 0;
  border-radius: 999px;
  padding: 9px 14px;
  font-weight: 700;
  cursor: pointer;
}
#startBtn {
  background: var(--accent);
  color: white;
}
#resetBtn {
  background: #cbd5e1;
  color: #0f172a;
}
.board {
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(3, minmax(80px, 1fr));
  gap: 10px;
}
.hole {
  aspect-ratio: 1 / 1;
  border-radius: 16px;
  border: 2px solid #dbeafe;
  background: #e0f2fe;
  display: grid;
  place-items: center;
  font-size: clamp(30px, 6vw, 42px);
  user-select: none;
  transition: transform .12s ease, background-color .12s ease;
}
.hole:active { transform: scale(.96); }
.hole.active {
  background: #fed7aa;
  border-color: #fdba74;
}
.note {
  margin-top: 12px;
  color: #334155;
  font-size: 14px;
}
@media (max-width: 560px) {
  h1 { font-size: 24px; }
}
</style>
</head>
<body>
<main class="wrap">
  <h1>빠른 두더지 게임</h1>
  <p class="sub">30초 동안 나타나는 두더지를 최대한 많이 클릭하세요.</p>

  <section class="top">
    <div class="stats">
      <span class="badge">점수: <strong id="score">0</strong></span>
      <span class="badge">남은 시간: <strong id="time">30</strong>초</span>
      <span class="badge">최고 점수: <strong id="best">0</strong></span>
    </div>
    <div class="controls">
      <button id="startBtn">시작</button>
      <button id="resetBtn">기록 초기화</button>
    </div>
  </section>

  <section class="board" id="board"></section>
  <p class="note" id="message">시작 버튼을 누르면 게임이 시작됩니다.</p>
</main>

<script>
const board = document.getElementById("board");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const bestEl = document.getElementById("best");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const message = document.getElementById("message");

const TOTAL_TIME = 30;
const HOLE_COUNT = 9;
let score = 0;
let timeLeft = TOTAL_TIME;
let gameRunning = false;
let activeIndex = -1;
let gameTimer = null;
let moleTimer = null;
let bestScore = Number(localStorage.getItem("mole_best_score") || 0);
bestEl.textContent = String(bestScore);

function createBoard() {
  board.innerHTML = "";
  for (let i = 0; i < HOLE_COUNT; i += 1) {
    const btn = document.createElement("button");
    btn.className = "hole";
    btn.type = "button";
    btn.dataset.index = String(i);
    btn.textContent = "🕳️";
    btn.addEventListener("click", onHoleClick);
    board.appendChild(btn);
  }
}

function getHoles() {
  return Array.from(document.querySelectorAll(".hole"));
}

function setActiveHole(index) {
  const holes = getHoles();
  holes.forEach((hole, i) => {
    const on = i === index;
    hole.classList.toggle("active", on);
    hole.textContent = on ? "🐹" : "🕳️";
  });
  activeIndex = index;
}

function randomIndex() {
  let idx = Math.floor(Math.random() * HOLE_COUNT);
  while (idx === activeIndex) {
    idx = Math.floor(Math.random() * HOLE_COUNT);
  }
  return idx;
}

function tickMole() {
  if (!gameRunning) return;
  setActiveHole(randomIndex());
  const next = 380 + Math.floor(Math.random() * 340);
  moleTimer = setTimeout(tickMole, next);
}

function onHoleClick(event) {
  if (!gameRunning) return;
  const idx = Number(event.currentTarget.dataset.index);
  if (idx !== activeIndex) return;
  score += 1;
  scoreEl.textContent = String(score);
  setActiveHole(-1);
}

function endGame() {
  gameRunning = false;
  clearInterval(gameTimer);
  clearTimeout(moleTimer);
  setActiveHole(-1);
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("mole_best_score", String(bestScore));
    bestEl.textContent = String(bestScore);
    message.textContent = `게임 종료. 새 최고 점수 ${bestScore}점!`;
  } else {
    message.textContent = `게임 종료. 이번 점수는 ${score}점입니다.`;
  }
  startBtn.disabled = false;
}

function startGame() {
  if (gameRunning) return;
  gameRunning = true;
  score = 0;
  timeLeft = TOTAL_TIME;
  scoreEl.textContent = "0";
  timeEl.textContent = String(TOTAL_TIME);
  message.textContent = "두더지를 클릭해서 점수를 올리세요!";
  startBtn.disabled = true;
  tickMole();
  gameTimer = setInterval(() => {
    timeLeft -= 1;
    timeEl.textContent = String(timeLeft);
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function resetBest() {
  bestScore = 0;
  localStorage.removeItem("mole_best_score");
  bestEl.textContent = "0";
  message.textContent = "최고 점수를 초기화했습니다.";
}

startBtn.addEventListener("click", startGame);
resetBtn.addEventListener("click", resetBest);

createBoard();
</script>
</body>
</html>
