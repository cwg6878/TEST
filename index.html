<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="google-adsense-account" content="ca-pub-2754903713509336" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2754903713509336" crossorigin="anonymous"></script>
<title>빠른 두더지 게임</title>
<style>
:root {
  --bg1: #0f172a;
  --bg2: #172554;
  --card: #f8fafc;
  --ink: #0f172a;
  --accent: #f97316;
  --accent-2: #06b6d4;
  --line: #d7dde7;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
  font-family: "Noto Sans KR", sans-serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.25), transparent 40%),
    radial-gradient(circle at 80% 10%, rgba(249, 115, 22, 0.2), transparent 35%),
    linear-gradient(160deg, var(--bg1), var(--bg2));
}
.wrap {
  width: min(860px, 100%);
  background: var(--card);
  color: var(--ink);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 20px 45px rgba(2, 8, 23, 0.45);
}
h1 { margin: 0; font-size: 30px; }
.sub { margin: 8px 0 16px; color: #475569; }
.top {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  background: #e2e8f0;
  border-radius: 999px;
  padding: 7px 12px;
  font-weight: 700;
}
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  border: 0;
  border-radius: 999px;
  padding: 9px 14px;
  font-weight: 700;
  cursor: pointer;
}
#startBtn { background: var(--accent); color: white; }
#resetBtn { background: #cbd5e1; color: #0f172a; }
#contactBtn { background: var(--accent-2); color: #082f49; }
.board {
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(3, minmax(80px, 1fr));
  gap: 10px;
}
.hole {
  aspect-ratio: 1 / 1;
  border-radius: 16px;
  border: 2px solid #dbeafe;
  background: #e0f2fe;
  display: grid;
  place-items: center;
  font-size: clamp(30px, 6vw, 42px);
  user-select: none;
  transition: transform .12s ease, background-color .12s ease;
}
.hole:active { transform: scale(.96); }
.hole.active {
  background: #fed7aa;
  border-color: #fdba74;
}
.note {
  margin-top: 12px;
  color: #334155;
  font-size: 14px;
}
.modal {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  background: rgba(15, 23, 42, 0.58);
  padding: 18px;
}
.modal.show { display: grid; }
.modal-card {
  width: min(620px, 100%);
  background: #fff;
  border-radius: 16px;
  border: 1px solid var(--line);
  padding: 18px;
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.modal-head h2 { margin: 0; font-size: 24px; }
.close-btn {
  background: #e2e8f0;
  color: #0f172a;
}
.form-grid { display: grid; gap: 10px; }
label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
input, textarea {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font: inherit;
}
textarea { min-height: 120px; resize: vertical; }
.submit-btn {
  background: #ad4e2b;
  color: #fff;
}
@media (max-width: 560px) {
  h1 { font-size: 24px; }
  .modal-head h2 { font-size: 20px; }
}
</style>
</head>
<body>
<main class="wrap">
  <h1>빠른 두더지 게임</h1>
  <p class="sub">30초 동안 나타나는 두더지를 최대한 많이 클릭하세요.</p>

  <section class="top">
    <div class="stats">
      <span class="badge">점수: <strong id="score">0</strong></span>
      <span class="badge">남은 시간: <strong id="time">30</strong>초</span>
      <span class="badge">최고 점수: <strong id="best">0</strong></span>
    </div>
    <div class="controls">
      <button id="startBtn" type="button">시작</button>
      <button id="resetBtn" type="button">기록 초기화</button>
      <button id="contactBtn" type="button">제휴 문의</button>
    </div>
  </section>

  <section class="board" id="board"></section>
  <p class="note" id="message">시작 버튼을 누르면 게임이 시작됩니다.</p>
</main>

<section class="modal" id="contactModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <h2>제휴 문의</h2>
      <button class="close-btn" id="closeModalBtn" type="button">닫기</button>
    </div>
    <form action="https://formspree.io/f/xrealdzz" method="POST" class="form-grid">
      <label>
        이름
        <input type="text" name="name" required />
      </label>
      <label>
        회사명
        <input type="text" name="company" required />
      </label>
      <label>
        이메일
        <input type="email" name="email" required />
      </label>
      <label>
        문의 내용
        <textarea name="message" required></textarea>
      </label>
      <input type="hidden" name="subject" value="[웹사이트] 제휴 문의 접수" />
      <button class="submit-btn" type="submit">문의 보내기</button>
    </form>
  </div>
</section>

<script>
const board = document.getElementById("board");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const bestEl = document.getElementById("best");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const contactBtn = document.getElementById("contactBtn");
const closeModalBtn = document.getElementById("closeModalBtn");
const contactModal = document.getElementById("contactModal");
const message = document.getElementById("message");

const TOTAL_TIME = 30;
const HOLE_COUNT = 9;
let score = 0;
let timeLeft = TOTAL_TIME;
let gameRunning = false;
let activeIndex = -1;
let gameTimer = null;
let moleTimer = null;
let bestScore = Number(localStorage.getItem("mole_best_score") || 0);
bestEl.textContent = String(bestScore);

function createBoard() {
  board.innerHTML = "";
  for (let i = 0; i < HOLE_COUNT; i += 1) {
    const btn = document.createElement("button");
    btn.className = "hole";
    btn.type = "button";
    btn.dataset.index = String(i);
    btn.textContent = "🕳️";
    btn.addEventListener("click", onHoleClick);
    board.appendChild(btn);
  }
}

function getHoles() {
  return Array.from(document.querySelectorAll(".hole"));
}

function setActiveHole(index) {
  const holes = getHoles();
  holes.forEach((hole, i) => {
    const on = i === index;
    hole.classList.toggle("active", on);
    hole.textContent = on ? "🐹" : "🕳️";
  });
  activeIndex = index;
}

function randomIndex() {
  let idx = Math.floor(Math.random() * HOLE_COUNT);
  while (idx === activeIndex) idx = Math.floor(Math.random() * HOLE_COUNT);
  return idx;
}

function tickMole() {
  if (!gameRunning) return;
  setActiveHole(randomIndex());
  const next = 380 + Math.floor(Math.random() * 340);
  moleTimer = setTimeout(tickMole, next);
}

function onHoleClick(event) {
  if (!gameRunning) return;
  const idx = Number(event.currentTarget.dataset.index);
  if (idx !== activeIndex) return;
  score += 1;
  scoreEl.textContent = String(score);
  setActiveHole(-1);
}

function endGame() {
  gameRunning = false;
  clearInterval(gameTimer);
  clearTimeout(moleTimer);
  setActiveHole(-1);
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("mole_best_score", String(bestScore));
    bestEl.textContent = String(bestScore);
    message.textContent = `게임 종료. 새 최고 점수 ${bestScore}점!`;
  } else {
    message.textContent = `게임 종료. 이번 점수는 ${score}점입니다.`;
  }
  startBtn.disabled = false;
}

function startGame() {
  if (gameRunning) return;
  gameRunning = true;
  score = 0;
  timeLeft = TOTAL_TIME;
  scoreEl.textContent = "0";
  timeEl.textContent = String(TOTAL_TIME);
  message.textContent = "두더지를 클릭해서 점수를 올리세요!";
  startBtn.disabled = true;
  tickMole();
  gameTimer = setInterval(() => {
    timeLeft -= 1;
    timeEl.textContent = String(timeLeft);
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function resetBest() {
  bestScore = 0;
  localStorage.removeItem("mole_best_score");
  bestEl.textContent = "0";
  message.textContent = "최고 점수를 초기화했습니다.";
}

function openModal() {
  contactModal.classList.add("show");
  contactModal.setAttribute("aria-hidden", "false");
}

function closeModal() {
  contactModal.classList.remove("show");
  contactModal.setAttribute("aria-hidden", "true");
}

startBtn.addEventListener("click", startGame);
resetBtn.addEventListener("click", resetBest);
contactBtn.addEventListener("click", openModal);
closeModalBtn.addEventListener("click", closeModal);
contactModal.addEventListener("click", (event) => {
  if (event.target === contactModal) closeModal();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeModal();
});

createBoard();
</script>
</body>
</html>
